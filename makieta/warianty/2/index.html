   <small>Całe auto:</small>${obraz(auto,{wybrane:wyb})}</div></div>`
   : `<div class="licznik">0 miejsc do sprawdzenia</div>`+brak(a)+obraz(auto,{wzorzec:true})}</main><div class="wariant">makieta · udawane dane</div>`; }
 window.wybierz=id=>{wyb=id;rysuj();}; rysuj(); }
